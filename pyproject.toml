[project]
name = "kaggriculture-counterfactual-eval"
version = "0.1.0"
description = "Local checkpoint/resume regression evaluator for Kaggriculture"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not simulator'"
markers = [
    "simulator: runs a real local Kaggriculture simulator match; excluded from the fast default suite",
]
